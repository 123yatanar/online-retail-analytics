name: DevSecOps Automated Testing & Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-and-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Testing & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install pytest bandit safety

      - name: Run Automated Unit Tests (Task 4)
        run: |
          python -m pytest test_task3_main.py -v

      - name: Run Static Application Security Testing (SAST - Bandit)
        run: |
          python -m bandit -r task3_main.py -ll

      - name: Run Software Composition Analysis (SCA - Safety)
        run: |
          python -m safety check --ignore 70612 || true